name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: gofmt
        run: |
          output=$(gofmt -l .)
          test -z "$output" || { echo "$output"; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -timeout=2s -count=1 ./...
